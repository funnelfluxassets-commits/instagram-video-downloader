  <!-- Outer Rounded Shield / Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#instaBrandGrad)"/>

  <!-- Stylized Geometric Downloader Core -->
  <!-- Top Arc / Media Disc -->
