      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="25%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#FF0069"/>
      <stop offset="75%" stop-color="#D300C5"/>
      <stop offset="100%" stop-color="#7638FA"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0069" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7638FA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#instaGrad)"/>
  
  <!-- Inner White Border Squircle -->
